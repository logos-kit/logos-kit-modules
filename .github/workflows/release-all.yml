name: Release all modules

# Umbrella workflow: releases every submodule in this catalog in
# parallel. Useful for the initial bootstrap and for coordinated
# "everything at once" releases.
#
# The module list is read from `modules.json` at run time (Logos Kit's
# modules live inside one monorepo submodule, which `.gitmodules` alone
# can't express).
#
# Each module is released through the same _release-module.yml local
# reusable workflow the per-module files use, so signing config stays
# consistent between solo and bulk runs. `fail-fast: false` lets one
# module's build fail without aborting the rest.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

# Shared by every workflow that can publish, so a manual run can't race
# release-on-merge.yml writing the same tag. Never cancel mid-publish.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      count: ${{ steps.scan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        shell: bash
        run: |
          set -euo pipefail
          # Logos Kit is one monorepo holding several modules, so the module
          # list is modules.json (paths inside the submodule), not .gitmodules.
          # Order is core first; the release legs still run in parallel and
          # the index converges because every rebuild rescans all releases.
          matrix="$(jq -c '{module_path: .modules}' modules.json)"
          count="$(jq '.modules | length' modules.json)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "count=${count}"  >> "$GITHUB_OUTPUT"
          echo "Discovered ${count} module(s):"
          jq -r '.modules[] | "  " + .' modules.json

  release:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: ${{ matrix.module_path }}
      force_build: ${{ inputs.force_build }}
    secrets: inherit
